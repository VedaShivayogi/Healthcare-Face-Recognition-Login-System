<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Patient Portal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand-block">
          <div class="brand-logo">K</div>
          <div>
            <h1>KLIKE</h1>
            <p>Patient Portal</p>
          </div>
        </div>
        <nav class="nav-links">
          <a class="nav-link active" href="/patient">Records</a>
          <a class="nav-link" href="/dashboard">Dashboard</a>
        </nav>
        <button id="logout-btn" class="secondary-btn full-width">Logout</button>
      </aside>
      <main class="main-panel">
        <div class="topbar">
          <div>
            <p class="eyebrow">Patient</p>
            <h2>{{ patient.username }}</h2>
          </div>
        </div>
        <section class="card">
          <h3>Appointments</h3>
          <table>
            <thead><tr><th>Date</th><th>Doctor</th><th>Department</th></tr></thead>
            <tbody>
              {% for item in appointments %}
              <tr>
                <td>{{ item.appointment_date }}</td>
                <td>{{ item.doctor }}</td>
                <td>{{ item.department }}</td>
              </tr>
              {% endfor %}
            </tbody>
          </table>
        </section>
      </main>
    </div>
    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
  </body>
</html>
